 <!DOCTYPE html>
 <html>
 <head>
   <title>PB-MPM</title>
   <link rel="icon" type="image/x-icon" href="/data/SEED_Logo.png">
 </head>

 <body id="body" style="background-image:linear-gradient(217deg, rgb(146, 146, 146), rgb(234, 234, 234) 50%); margin:0; width: 100vw; height:100vh;">
  <main id="main">
    <link rel="stylesheet" href="style.css">
    <canvas id='canvas' style="position:absolute;"></canvas>
    <canvas id='vectorCanvas' style="position:absolute;"></canvas>
    <div id="ui" class="uiPanel" style="display:none">

    <div id='uiPanel' style="height:100%" >
      <button id="settingsTabButton" style="position: absolute; height:5%; width:33.3%">Settings</button>
      <button id="shapesTabButton" style="position: absolute; height:5%; left:33.33%; width:33.3%">Shapes</button>
      <button id="performanceTabButton" style="position: absolute; left:66.66%; height:5%; width:33.3%">Stats</button>
      
      <div id="settingsTabContent" style="position:absolute; top:5%; height:95%; width:100%;">
      <form id="uiContainer" style="height:100%; width:100%;  background-color:rgba(23, 27, 36, 0.8);  overflow:auto;">
        <!-- Automatically generated UI goes here -->
      </form>
      </div>

      <div id="shapesTabContent" style="position:absolute; top:5%; height:95%; width:100%; display:none; background-color:rgba(23, 27, 36, 0.8);  overflow:auto;">
        <button id="newShapeButton">New Shape</button>
        <div id="shapesList">

        </div>
      </div>

      <div id="performanceTabContent" style="position:absolute; top:5%; height:95%; width:100%; display:none; background-color:rgba(23, 27, 36, 0.8);  overflow:auto;">
        <output class='input' id="timingStats">Timing stats are not available.</output><br>
        <output class='input' id="speedStats"></output><br>
        <output class='input' id="gridStats"></output><br>
        <output class='input' id="particleStats">Particle count is not available.</output>
      </div>

      <button id="uiButton" class="uiButton"><div class="uiText">Controls</div></button>
    </div>

  </div>

   <script type="module" src="../src/main.js"></script>

   <canvas id="demo-canvas" width="800" height="600" style="position:fixed; top:0; left:0; z-index:1; width:800px; height:600px;"></canvas>

   <script type="module">
     import Box2DFactory from './box2d/entry.mjs';

     import DebugDrawRenderer from './box2d/utils/debugDraw.mjs';

      const params = new URLSearchParams(window.location.search);

      const box2d = await Box2DFactory();
      const canvas = document.getElementById("demo-canvas");

      canvas.width = 800;
      canvas.height = 600;
      canvas.style.width = `800px`;
      canvas.style.height = `600px`;
      Object.assign(canvas.style, {
        position: 'absolute',
        top: '50%',
        left: '50%',
        transform: 'translate(-50%, -50%)',
        zIndex: 1,
        pointerEvents: 'none',
      });

      const ctx = canvas.getContext("2d");

      const pixelToMeters = 32;
      const subStepCount = 4;

      const hdRendering = params.get('hd') === '1';

      const debugDraw = new DebugDrawRenderer(box2d, ctx, {pixelToMeters, autoHD: hdRendering}); // true for high dpi
      debugDraw.offset = {
        x: 0,
        y: 0
      };


      const {
        b2DefaultWorldDef,
        b2CreateWorld,
        b2CreateBody,
        b2CreatePolygonShape,
        b2CreateSegmentShape,
        b2World_Step,
        b2MakeBox,
        b2DefaultBodyDef,
        b2DefaultShapeDef,
        b2BodyType,
        b2Segment,
        b2Vec2,
        b2Rot,
        TaskSystem,
        b2CreateThreadedWorld,
        b2World_GetProfile,
        b2Body_GetPosition,
        b2Body_GetLinearVelocity,
        b2Body_GetRotation,
        b2Rot_GetAngle,
        b2Body_GetAngularVelocity,
        b2Body_ApplyLinearImpulseToCenter,
        b2Body_ApplyAngularImpulse,
        b2DefaultRevoluteJointDef,
        b2CreateRevoluteJoint,
        b2MakeRoundedBox
      } = box2d;

      const worldDef = b2DefaultWorldDef();
      worldDef.gravity.Set(0, -10);

      let worldId, taskSystem;

      const statsLevel = params.get('stats') || 2;

      if(params.get('threading') === '1') {
        taskSystem = new TaskSystem(navigator.hardwareConcurrency);
        worldId = b2CreateThreadedWorld(worldDef, taskSystem);
      } else {
        worldId = b2CreateWorld(worldDef);
      }

      const bd_ground = new b2DefaultBodyDef();
      const groundId = b2CreateBody(worldId, bd_ground);

      const shapeDefSegment = new b2DefaultShapeDef();
      shapeDefSegment.density = 1.0;
      shapeDefSegment.material.friction = 0.3;

      {
        const segment = new b2Segment();
        segment.point1 = new b2Vec2(0, -0);
        segment.point2 = new b2Vec2(6, -7);

        b2CreateSegmentShape(groundId, shapeDefSegment, segment);
      }

      {
        const segment = new b2Segment();
        segment.point1 = new b2Vec2(3, -18);
        segment.point2 = new b2Vec2(22, -18)
        b2CreateSegmentShape(groundId, shapeDefSegment, segment);
      }


      const rot = new b2Rot();
      rot.SetAngle(0);

      const bodyIds = [];
      const v = new b2Vec2();


      let spinnerId;

      {
        const bodyDef = b2DefaultBodyDef();

        const x = 800 / pixelToMeters / 2;
        const y = 600 / pixelToMeters / 2;

        bodyDef.type = b2BodyType.b2_dynamicBody;
        bodyDef.position.Set(x, -y);
        bodyDef.enableSleep = false;
        bodyDef.angularDamping = 2.0;

        spinnerId = b2CreateBody( worldId, bodyDef );

        const box = b2MakeBox( 0.6, 5.0);
        const shapeDef = b2DefaultShapeDef();
        shapeDef.friction = 0.0;
        b2CreatePolygonShape( spinnerId, shapeDef, box );

        const motorSpeed = 5.0;
        const maxMotorTorque = 40000.0;
        const jointDef = b2DefaultRevoluteJointDef();
        jointDef.bodyIdA = groundId;
        jointDef.bodyIdB = spinnerId;
        jointDef.localAnchorA.Copy(bodyDef.position);
        jointDef.enableMotor = true;
        jointDef.motorSpeed = motorSpeed;
        jointDef.maxMotorTorque = maxMotorTorque;

        // const m_revoluteJoint = b2CreateRevoluteJoint( worldId, jointDef );

        bodyDef.delete();
        box.delete();
        shapeDef.delete();
        jointDef.delete();

        bodyIds.push(spinnerId);
      }
        



      function drawProfile(stepDuration, profile) {
        const hdScale = hdRendering ? (Math.min(window.devicePixelRatio || 1, 2) || 1) : 1;
        ctx.font = `${16 * hdScale}px Arial`;
        ctx.fillStyle = "black";
        if (statsLevel < 1) return;
        ctx.fillText(`fps: ${Math.floor(1000/stepDuration)}`, 10 * hdScale, 20 * hdScale);
        ctx.fillText(`threading: ${taskSystem ? 'on' : 'off'}`, 100 * hdScale, 20 * hdScale);
        debugDraw.debugMemory = true;
        if (statsLevel < 2) return;
        ctx.fillText(`step: ${profile.step.toFixed(2)}ms`, 10 * hdScale, 40 * hdScale);
        ctx.fillText(`pairs: ${profile.pairs.toFixed(2)}ms`, 10 * hdScale, 60 * hdScale);
        ctx.fillText(`collide: ${profile.collide.toFixed(2)}ms`, 10 * hdScale, 80 * hdScale);
        ctx.fillText(`solve: ${profile.solve.toFixed(2)}ms`, 10 * hdScale, 100 * hdScale);
        ctx.fillText(`mergeIslands: ${profile.mergeIslands.toFixed(2)}ms`, 10 * hdScale, 120 * hdScale);
        ctx.fillText(`prepareStages: ${profile.prepareStages.toFixed(2)}ms`, 10 * hdScale, 140 * hdScale);
        ctx.fillText(`solveConstraints: ${profile.solveConstraints.toFixed(2)}ms`, 10 * hdScale, 160 * hdScale);
        ctx.fillText(`prepareConstraints: ${profile.prepareConstraints.toFixed(2)}ms`, 10 * hdScale, 180 * hdScale);
        ctx.fillText(`integrateVelocities: ${profile.integrateVelocities.toFixed(2)}ms`, 10 * hdScale, 200 * hdScale);
        ctx.fillText(`warmStart: ${profile.warmStart.toFixed(2)}ms`, 10 * hdScale, 220 * hdScale);
        ctx.fillText(`solveImpulses: ${profile.solveImpulses.toFixed(2)}ms`, 10 * hdScale, 240 * hdScale);
        ctx.fillText(`integratePositions: ${profile.integratePositions.toFixed(2)}ms`, 10 * hdScale, 260 * hdScale);
        ctx.fillText(`applyRestitution: ${profile.applyRestitution.toFixed(2)}ms`, 10 * hdScale, 280 * hdScale);
        ctx.fillText(`storeImpulses: ${profile.storeImpulses.toFixed(2)}ms`, 10 * hdScale, 300 * hdScale);
        ctx.fillText(`transforms: ${profile.transforms.toFixed(2)}ms`, 10 * hdScale, 320 * hdScale);
        ctx.fillText(`splitIslands: ${profile.splitIslands.toFixed(2)}ms`, 10 * hdScale, 340 * hdScale);
        ctx.fillText(`hitEvents: ${profile.hitEvents.toFixed(2)}ms`, 10 * hdScale, 360 * hdScale);
        ctx.fillText(`refit: ${profile.refit.toFixed(2)}ms`, 10 * hdScale, 380 * hdScale);
        ctx.fillText(`bullets: ${profile.bullets.toFixed(2)}ms`, 10 * hdScale, 400 * hdScale);
        ctx.fillText(`hitEvents: ${profile.hitEvents.toFixed(2)}ms`, 10 * hdScale, 420 * hdScale);
        ctx.fillText(`sleepIslands: ${profile.sleepIslands.toFixed(2)}ms`, 10 * hdScale, 440 * hdScale);
        ctx.fillText(`sensors: ${profile.sensors.toFixed(2)}ms`, 10 * hdScale, 460 * hdScale);
      }

      let handle;
      function loop(prevMs) {
          const nowMs = window.performance.now();
          handle = requestAnimationFrame(loop.bind(null, nowMs));
          const deltaMs = Math.min(nowMs-prevMs, 1000/120);

          const start = performance.now();
          b2World_Step(worldId, deltaMs / 1000, subStepCount);
          const end = performance.now();
          taskSystem?.ClearTasks();

          ctx.clearRect(0, 0, canvas.width, canvas.height);
          debugDraw.Draw(worldId);

          const duration = end - start;
          const profile = b2World_GetProfile(worldId);
          drawProfile(duration, profile);
          profile.delete();
      };

      window.getBodyData = (inputs) => {
          const renderToSimScale = 1.0/inputs.simResDivisor;
          const simConversion = pixelToMeters * renderToSimScale;

          const bodies = [];
          for (let i = 0; i < bodyIds.length; i++) {
              const bodyId = bodyIds[i];
              const pos = b2Body_GetPosition(bodyId);
              const vel = b2Body_GetLinearVelocity(bodyId);
              const rotation = b2Rot_GetAngle(b2Body_GetRotation(bodyId));

              const simPos = [pos.x * simConversion, inputs.gridSize[1] + pos.y * simConversion];
              bodies.push({
                  id: bodyId,
                  position: simPos,
                  linearVelocity: [vel.x * simConversion, vel.y * simConversion],
                  rotation: rotation,
                  angularVelocity: b2Body_GetAngularVelocity(bodyId),
                  halfSize: [1 * simConversion, 1 * simConversion], // Assuming a box shape for simplicity
              });
          }
          return bodies;
      }

      window.getRigidBodyData = (inputs) => {
        const {
            b2Body_GetPosition,
            b2Body_GetLinearVelocity,
            b2Body_GetRotation,
            b2Rot_GetAngle,
            b2Body_GetMass,
            b2Body_GetShapes,
            b2Body_GetShapeCount,
            b2Shape_GetType,
            b2ShapeType,
            b2Shape_GetCircle,
            b2Shape_GetPolygon,
        } = box2d;

        // The two main arrays we will populate
        const bodies = [];
        const shapes = [];

        // Conversion factor from Box2D meters to our simulation grid units
        const renderToSimScale = 1.0 / inputs.simResDivisor;
        const simConversion = pixelToMeters * renderToSimScale; // Assuming inputs.pixelToMeters exists

        // A running counter for the start index of the next body's shapes
        let currentShapeIndex = 0;

        for (const bodyId of bodyIds) {
            const shapePtrs = b2Body_GetShapes(bodyId, b2Body_GetShapeCount(bodyId));
            const shapeCountForThisBody = shapePtrs.length;

            for (const shapePtr of shapePtrs) {
                const shapeType = b2Shape_GetType(shapePtr);

                // cicle
                if (shapeType.value === b2ShapeType.b2_circleShape.value) {
                    const circle = b2Shape_GetCircle(shapePtr);
                    const localPos = circle.position;

                    shapes.push({
                        position: [localPos.x * simConversion, localPos.y * simConversion],
                        radius: circle.radius * simConversion,
                        shapeType: shapeType.value,
                        vertices: new Float32Array(16), // 8 vec2f, zero-filled
                        vertexCount: 0,
                    });
                }
                // polygon
                else if (shapeType.value === b2ShapeType.b2_polygonShape.value) {
                  const polygon = b2Shape_GetPolygon(shapePtr);
                  const vertexCount = polygon.count;
                  
                  const gpuVerts = new Float32Array(16);
                  const gpuNormals = new Float32Array(16);
                  const gpuPlanes = new Float32Array(8);
                  
                  for (let i = 0; i < vertexCount; i++) {
                      const vertex = polygon.GetVertex(i);
                      gpuVerts[i * 2] = vertex.x * simConversion;
                      gpuVerts[i * 2 + 1] = vertex.y * simConversion;
                  }

                  // Calculate edge normals and plane constants for the SAT-based collision checks on the GPU.
                  for (let i = 0; i < vertexCount; i++) {
                      const p1_x = gpuVerts[i * 2];
                      const p1_y = gpuVerts[i * 2 + 1];

                      const next_i = (i + 1) % vertexCount;
                      const p2_x = gpuVerts[next_i * 2];
                      const p2_y = gpuVerts[next_i * 2 + 1];

                      const edge_x = p2_x - p1_x;
                      const edge_y = p2_y - p1_y;

                      let normal_x = edge_y;
                      let normal_y = -edge_x;

                      const len = Math.sqrt(normal_x * normal_x + normal_y * normal_y);
                      if (len > 0) {
                          normal_x /= len;
                          normal_y /= len;
                      }

                      gpuNormals[i * 2] = normal_x;
                      gpuNormals[i * 2 + 1] = normal_y;

                      gpuPlanes[i] = p1_x * normal_x + p1_y * normal_y;
                  }

                  
                  let maxDistSq = 0;
                  for (let i = 0; i < vertexCount; i++) {
                      const vx = gpuVerts[i * 2];
                      const vy = gpuVerts[i * 2 + 1];
                      const distSq = vx * vx + vy * vy;
                      if (distSq > maxDistSq) {
                          maxDistSq = distSq;
                      }
                  }
                  const boundRadius = Math.sqrt(maxDistSq);

                  shapes.push({
                      position: [0, 0],
                      shapeType: shapeType.value,

                      boundRadius: boundRadius,
                      polyCount: vertexCount,
                      polyVerts: gpuVerts,
                      polyNormals: gpuNormals,
                      polyPlane: gpuPlanes,

                      radius: 0,
                  });
                }
            }

            const pos = b2Body_GetPosition(bodyId);
            const vel = b2Body_GetLinearVelocity(bodyId);
            const angular = b2Body_GetAngularVelocity(bodyId);
            const mass = b2Body_GetMass(bodyId);

            bodies.push({
                mass: mass,
                position: [pos.x * simConversion, inputs.gridSize[1] + (pos.y * simConversion)],
                angle: b2Rot_GetAngle(b2Body_GetRotation(bodyId)),
                velocity: [vel.x * pixelToMeters, -vel.y * pixelToMeters],
                angularVelocity: angular,
                // link to the 'shapes' array
                shapeStartIndex: currentShapeIndex,
                shapeCount: shapeCountForThisBody,
            });

            // Update the running index for the next body
            currentShapeIndex += shapeCountForThisBody;
        }

        return {
            bodies,
            shapes
        };
      };

      window.applyImpulses = function(inputs, impulsesToApply) {
          for (const impulseData of impulsesToApply) {
              const { bodyIndex, impulse, angularImpulse } = impulseData;

              if (!bodyIds[bodyIndex]) continue;
              
              const bodyId = bodyIds[bodyIndex];
              b2Body_ApplyLinearImpulseToCenter(bodyId, v.Set(impulse.x / 1000, impulse.y / 1000), true);
              b2Body_ApplyAngularImpulse(bodyId, angularImpulse / 1000, true);
          }
      };

      loop(window.performance.now());
  </script>
  </main>
  <div id="loadingContainer"  style="display:flex; justify-content:center; align-items:center; flex-direction:column; height:100%">
    <img id="loadingAnimation" src="/data/SEED_inverted.png" style="width:380px"/>
    <h1 id='loadingText' style="font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color:aliceblue; text-align:left; width:300px; margin-left:170px">Loading...</h1>
    <h2 id='errorText' style="text-align:center"></h1>
  </div>
  </body>
